# 로컬 개발용 설정 (기본 프로필)
# Phase 1에서 PostgreSQL(infra/docker-compose.yml) 연결 설정을 추가한다.

logging:
  level:
    com.campushangout: DEBUG

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campushangout}
    username: ${DB_USERNAME:campushangout}
    password: ${DB_PASSWORD:campushangout-local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
